name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-ix-mapper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Use pinned npm with trusted publishing support
        run: npm install -g npm@11.6.2

      - name: Install exact dependencies
        run: npm ci

      - name: Validate immutable release ref
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Publishing requires the exact immutable tag v${VERSION}" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release commit must be on origin/main" >&2
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} already exists on npm" >&2
            exit 1
          fi

      - name: Run golden, adversarial, and type tests
        run: npm test

      - name: Verify exact compatibility tuples and remote SDK tarballs
        run: npm run verify:artifacts
        env:
          IX_MAPPER_VERIFY_SDK_TARBALLS: "1"

      - name: Build neutral and legacy entrypoints
        run: npm run build

      - name: Verify packed neutral and legacy consumers
        run: npm run verify:packed-consumer

      - name: Build immutable publication contract
        run: npm run pack:contract

      - name: Verify immutable publication contract
        run: npm run verify:publication-contract

      - name: Upload exact publication archive and contract
        uses: actions/upload-artifact@v4
        with:
          name: ix-mapper-publication
          path: publication/
          if-no-files-found: error

      - name: Publish the verified archive
        shell: bash
        run: |
          set -euo pipefail

          CONTRACT="$(find publication -maxdepth 1 -name '*.publication.json' -print -quit)"
          ARCHIVE="$(node -p "require('./${CONTRACT}').tarball.filename")"
          DIST_TAG="$(node -p "require('./${CONTRACT}').release.distTag")"

          npm publish "publication/${ARCHIVE}" --access public --provenance --tag "${DIST_TAG}"

      - name: Verify registry integrity and signatures
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          CONTRACT="$(find publication -maxdepth 1 -name '*.publication.json' -print -quit)"
          EXPECTED_INTEGRITY="$(node -p "require('./${CONTRACT}').tarball.npmIntegrity")"
          TMP_DIR="$(mktemp -d)"

          for attempt in {1..10}; do
            ACTUAL_INTEGRITY="$(npm view "${PACKAGE_NAME}@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [[ "${ACTUAL_INTEGRITY}" == "${EXPECTED_INTEGRITY}" ]]; then
              break
            fi
            if [[ "${attempt}" == "10" ]]; then
              echo "Published npm integrity did not match the immutable contract" >&2
              exit 1
            fi
            sleep 15
          done

          cd "${TMP_DIR}"
          npm init -y
          npm install "${PACKAGE_NAME}@${VERSION}"
          npm audit signatures
