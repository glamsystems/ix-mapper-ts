name: Build ix-mapper

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ix-mapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify compatibility artifacts
        run: npm run verify:artifacts
        env:
          IX_MAPPER_VERIFY_SDK_TARBALLS: "1"

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail

          npm pack --dry-run --json > npm-pack-dry-run.json

          node <<'NODE'
          const fs = require("node:fs");
          const pack = JSON.parse(fs.readFileSync("npm-pack-dry-run.json", "utf8"))[0];
          const files = new Set(pack.files.map((file) => file.path));
          const required = [
            "index.cjs",
            "index.esm.js",
            "index.cjs.d.ts",
            "index.esm.d.ts",
            "src/index.d.ts",
            "src/pda.d.ts",
            "src/strict.d.ts",
            "src/types.d.ts",
            "mapping-configs-v2/KvauGMspG5k6rtzrqqn7WNn3oZdyKqLKwK2XWQ8FLjd.json",
            "mapping-configs-v2-staging/KvauGMspG5k6rtzrqqn7WNn3oZdyKqLKwK2XWQ8FLjd.json",
            "compatibility-manifests/schema-v1.json",
            "compatibility-manifests/v1/kamino-kvaults-production.json",
            "compatibility-manifests/v1/kamino-kvaults-staging.json",
            "artifacts/kamino-kvaults/9.1.5/native-kvault.json",
            "artifacts/ext-kamino/1.0.1/production.json",
            "artifacts/ext-kamino/1.0.1/staging.json",
            "README.md",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
          ];

          for (const file of required) {
            if (!files.has(file)) {
              throw new Error(`Missing expected package file: ${file}`);
            }
          }

          console.log(
            JSON.stringify(
              {
                filename: pack.filename,
                files: pack.files.length,
                unpackedSize: pack.unpackedSize,
              },
              null,
              2,
            ),
          );
          NODE

      - name: Smoke test package entrypoint
        run: |
          node -e "const mapper = require('./index.cjs'); for (const name of ['mapInstruction', 'mapInstructions', 'mapToGlamIx', 'fixSignerAccounts', 'normalizeInstruction']) if (typeof mapper[name] !== 'function') process.exit(1);"

      - name: Upload pack manifest
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json
