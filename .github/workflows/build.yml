name: Build ix-mapper

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ix-mapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck sources and tests
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail

          npm pack --dry-run --json > npm-pack-dry-run.json

          node <<'NODE'
          const fs = require("node:fs");
          const pack = JSON.parse(fs.readFileSync("npm-pack-dry-run.json", "utf8"))[0];
          const files = new Set(pack.files.map((file) => file.path));
          const required = [
            "dist/index.js",
            "dist/index.d.ts",
            "dist/web3.js",
            "dist/web3.d.ts",
            "dist/generated/mapping/index.js",
            "README.md",
            "LICENSE",
            "package.json",
          ];

          for (const file of required) {
            if (!files.has(file)) {
              throw new Error(`Missing expected package file: ${file}`);
            }
          }

          for (const file of files) {
            if (file.startsWith("src/") || file.startsWith("test/")) {
              throw new Error(`Source file in the package: ${file}`);
            }
          }

          console.log(
            JSON.stringify(
              {
                filename: pack.filename,
                files: pack.files.length,
                unpackedSize: pack.unpackedSize,
              },
              null,
              2,
            ),
          );
          NODE

      - name: Smoke test package entrypoints
        run: |
          node --input-type=module -e "
            import { createMapper, mapKitInstruction, parseMappingDocument } from './dist/index.js';
            import { mapWeb3Instruction } from './dist/web3.js';
            for (const fn of [createMapper, mapKitInstruction, parseMappingDocument, mapWeb3Instruction]) {
              if (typeof fn !== 'function') process.exit(1);
            }
            createMapper({ environment: 'production' });
            createMapper({ environment: 'staging' });
          "

      - name: Upload pack manifest
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json
