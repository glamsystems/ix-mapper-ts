name: Build ix-mapper

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ix-mapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Use pinned npm
        run: npm install -g npm@11.6.2

      - name: Install exact dependencies
        run: npm ci

      - name: Run golden, adversarial, and type tests
        run: npm test

      - name: Verify exact compatibility tuples and remote SDK tarballs
        run: npm run verify:artifacts
        env:
          IX_MAPPER_VERIFY_SDK_TARBALLS: "1"

      - name: Build neutral and legacy entrypoints
        run: npm run build

      - name: Verify packed neutral and legacy consumers
        run: npm run verify:packed-consumer

      - name: Build immutable publication contract
        run: npm run pack:contract

      - name: Verify immutable publication contract
        run: npm run verify:publication-contract

      - name: Reject mutated publication sidecar metadata
        run: npm run verify:publication-adversarial

      - name: Upload immutable proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: ix-mapper-publication-node-${{ matrix.node-version }}
          path: publication/
          if-no-files-found: error

  reproducible-publication:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download both runtime publication contracts
        uses: actions/download-artifact@v4
        with:
          pattern: ix-mapper-publication-node-*
          path: publication-matrix/

      - name: Require byte-identical Node 22 and Node 24 archives
        run: npm run verify:publication-reproducibility -- publication-matrix
